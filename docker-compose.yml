# Local Postgres for the integration tests (`pnpm test`). CI uses an equivalent service container.
#   docker compose up -d
#   TEST_DATABASE_URL=postgres://core:core@localhost:5433/core_test pnpm test
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
      POSTGRES_DB: core_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U core']
      interval: 5s
      timeout: 5s
      retries: 10
